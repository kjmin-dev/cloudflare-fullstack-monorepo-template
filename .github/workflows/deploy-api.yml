name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'packages/api/**'
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: DEPLOY_CF_PROD
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Inject D1 database ID
        working-directory: packages/api
        run: sed -i 's/<CLOUDFLARE_D1_DATABASE_ID>/${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}/' wrangler.jsonc

      - name: Run D1 migrations
        working-directory: packages/api
        run: bunx wrangler d1 migrations apply D1_DB --remote -e production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        working-directory: packages/api
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
